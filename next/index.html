<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Art of Sacrifice</title>
<meta name="description" content="A ten minute strategy simulation. It is 2014. Choose a strategy for a telecom, fund it, choose what to measure, and see 1,000 futures.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0d1420;--panel:#141d2d;--panel2:#1a2538;--line:#2a3750;--ink:#eef2f8;--mute:#9aa8be;--brass:#e0b45a;--cy:#5cc8e8;--red:#ef6a5a;--green:#6fd08c;--amber:#f0a94a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#1b2a44 0,var(--bg) 60%);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0 0 .4em;letter-spacing:.2px}
h1{font-size:clamp(34px,5vw,68px);line-height:1.02}h2{font-size:clamp(22px,2.2vw,32px)}h3{font-size:18px}
p{margin:.4em 0}.mute{color:var(--mute)}.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(13,20,32,.8);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.brand{font-family:Fraunces,serif;font-size:20px;color:var(--brass);white-space:nowrap}
.dots{display:flex;gap:6px;flex:1;align-items:center;min-width:0}
.dot{height:6px;flex:1;max-width:70px;border-radius:3px;background:var(--line)}.dot.on{background:var(--brass)}.dot.done{background:#7d6a3c}
.stepname{color:var(--mute);font-size:13px;white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.ghost:hover{border-color:var(--brass)}
main{max-width:1500px;margin:0 auto;padding:22px}
.hero{min-height:calc(100vh - 120px);display:grid;align-content:center;gap:18px;max-width:900px}
.hero p{font-size:clamp(17px,1.5vw,22px);color:#cdd6e4;max-width:44em}
.cta{background:var(--brass);color:#1a1405;border:0;border-radius:10px;padding:14px 26px;font-weight:700;font-size:18px;justify-self:start}
.cta:disabled{opacity:.35;cursor:not-allowed}.cta:hover:not(:disabled){filter:brightness(1.08)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.tile b{display:block;font-family:Fraunces,serif;font-size:22px;color:var(--brass);margin:2px 0}
.tile .k{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
fieldset{border:0;padding:0;margin:14px 0 0}legend{font-family:Fraunces,serif;font-size:22px;padding:0;margin-bottom:10px}
.choice{display:block;position:relative;margin:8px 0}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.choice span{display:block;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 14px}
.choice input:checked+span{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.choice input:focus-visible+span{outline:2px solid var(--cy)}
.strat{cursor:pointer;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:block;width:100%}

.fb{border-left:3px solid var(--brass);padding:8px 14px;margin-top:12px;background:var(--panel2);border-radius:0 10px 10px 0}
.board{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.news{display:flex;gap:14px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.news .yr{font-family:Fraunces,serif;font-size:26px;color:var(--brass);white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .nm{font-weight:600}.row .nt{font-size:13px;color:var(--mute)}

.deal.on{background:var(--brass);color:#1a1405;border-color:var(--brass)}.deal:disabled{opacity:.35;cursor:not-allowed}
.borrow{border:1px dashed var(--red);border-radius:12px;padding:4px 12px;margin-top:10px;background:rgba(239,106,90,.06)}
.borrow .row{border:0}
.meter{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.left{font:600 20px Fraunces,serif}.left.bad{color:var(--red)}.left.ok{color:var(--green)}
.kp{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.kp button.on{background:var(--cy);color:#04202a;border-color:var(--cy);font-weight:600}
canvas{display:block;width:100%}
.stat{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}.stat b{font-family:Fraunces,serif}
.memo{border-left:3px solid var(--line);padding:7px 12px;margin:8px 0;background:var(--panel2);border-radius:0 8px 8px 0}
.memo.fits{border-color:var(--green)}.memo.conflicts{border-color:var(--red)}
.memo .t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.memo.fits .t i{color:var(--green);font-style:normal}.memo.conflicts .t i{color:var(--red);font-style:normal}
.overlay{position:fixed;inset:0;background:rgba(5,9,16,.72);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:860px;width:100%;max-height:92vh;overflow:auto}
.bars .b{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0}
.bars .tr{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}.bars .tr i{display:block;height:100%;background:var(--brass)}
.big{font:600 clamp(48px,6vw,88px)/1 Fraunces,serif;color:var(--brass)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:3px 4px 3px 0;font-size:14px}
.pill.no{border-color:var(--brass);color:var(--brass)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.tl{display:grid;grid-template-columns:72px 1fr;gap:6px 14px;margin:10px 0}.tl .y{font:600 22px Fraunces,serif;color:var(--brass)}
a{color:var(--cy)}sup a{text-decoration:none;font-size:12px}
.foot{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
@media (max-width:900px){main{padding:14px}.board,.g2,.g3,.g4{grid-template-columns:1fr}.stepname{display:none}.top{padding:10px 14px;gap:10px}.brand{font-size:16px}.bars .b{grid-template-columns:110px 1fr 48px}.tl{grid-template-columns:56px 1fr}.deal{min-width:104px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#gave{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#444);background:transparent;color:inherit;font:inherit}#gave option{color:#111}.ef{margin-top:8px}

<body><header class="top"><div class="brand">The Art of Sacrifice</div><div class="dots" id="dots" aria-hidden="true"></div><div class="stepname" id="stepname"></div><button class="ghost" id="aboutBtn">About</button></header>
<main id="app"></main><div id="ov"></div>
<script>// Illustrative model of a generic telecom in 2014. Not a forecast and not a model of any real company.
const CHIP_B = 4;
const OPTS = ['fiber','wireless','enterprise','legacy','ptv','media','cable','abroad','dividend','debt'];
const DEALS = ['ptv','media','cable','abroad'];
const KPIS = ['adds','rev','margin','fcf','churn','homes','video','biz','intl','lev'];
const DEAL_COST = { ptv: 8, media: 12, cable: 10, abroad: 8 };
const START = { debt: 6, base: 11, wireless: 50, legacy: 30, divExpected: 3, borrowMax: 6 };
const Z = { fiber:0, wireless:0, enterprise:0, legacy:0, ptv:0, media:0, cable:0, abroad:0, dividend:.5, debt:.5 };
const fit = o => Object.assign({}, Z, o);
const FIT = {
  network:   fit({ fiber:1, wireless:1, enterprise:.5 }),
  bundle:    fit({ ptv:1, wireless:1, fiber:.5 }),
  content:   fit({ media:1, wireless:1, ptv:.5, fiber:.5 }),
  broadband: fit({ cable:1, fiber:1, wireless:.5 }),
  abroad:    fit({ abroad:1, wireless:1 }),
  business:  fit({ enterprise:1, wireless:1, fiber:.5 })
};
const KZ = { adds:0, rev:0, margin:0, fcf:0, churn:0, homes:0, video:0, biz:0, intl:0, lev:.5 };
const kfit = o => Object.assign({}, KZ, o);
const KFIT = {
  network:   kfit({ churn:1, homes:1, adds:.5 }),
  bundle:    kfit({ video:1, churn:1, adds:1, rev:.5, fcf:.5 }),
  content:   kfit({ rev:1, video:.5, churn:.5, adds:.5, fcf:.5 }),
  broadband: kfit({ homes:1, churn:1, rev:.5, adds:.5 }),
  abroad:    kfit({ intl:1, adds:1, rev:.5, fcf:.5 }),
  business:  kfit({ biz:1, churn:1, rev:.5 })
};
// Tuned so each strategy, fully funded and measured to match, has a similar middle result.
const P = { fiberTake: 2.0, entTake: 2.05, wGrow: .04, tvSyn: .036, mediaMu: 1.16, mediaSyn: .012, cableMu: 1.13, abroadMu: 1.14, block: .15,
            side: { 1: 1, .5: .85, 0: .65 }, dealSide: { 1: 0, .5: -.04, 0: -.10 }, unfunded: .88 };
function rng(seed){ let a = seed>>>0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0,v=0; while(u===0)u=r(); while(v===0)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function emptyAlloc(){ const a = { borrow:0 }; OPTS.forEach(o=>a[o]=0); return a; }
function ledger(rounds){
  let debt = START.debt; const out = []; const at = { ptv:-1, media:-1, cable:-1, abroad:-1 };
  for (let t=0; t<4; t++){
    const drag = Math.floor(debt/6); let cash = 0;
    if (at.ptv>=0 && t-at.ptv>=1 && t-at.ptv<=2) cash += 1;
    ['media','cable','abroad'].forEach(d => { if (at[d]>=0 && t-at[d]>=1) cash += 1; });
    const a = rounds[t]; const owned = {}; DEALS.forEach(d => owned[d] = at[d]>=0);
    out.push({ debtStart: debt, drag, cash, base: START.base - drag + cash, owned });
    if (!a) break;
    DEALS.forEach(d => { if (a[d]>0 && at[d]<0) at[d] = t; });
    debt = Math.max(0, debt + a.borrow - a.debt);
  }
  return out;
}
function spent(a){ let s = 0; OPTS.forEach(o => s += a[o]); return s; }
function drawFuture(r){
  const four = sd => [0,1,2,3].map(()=> gauss(r)*sd);
  return { cord: r()*.30, war: r()*.05, take: Math.exp(.25*gauss(r) - .03125), ent: Math.exp(.35*gauss(r) - .06125), rates: r()*.35,
           hits: four(.3), cab: four(.12), fx: four(.28), blocked: r() < P.block };
}
function coreShare(rounds, strategy){ let c = 0, all = 0; rounds.forEach(a => OPTS.forEach(o => { all += a[o]; if (strategy && FIT[strategy][o]===1) c += a[o]; })); return all ? c/all : 0; }
function valueOf(rounds, kpis, strategy, f){
  const F = strategy ? FIT[strategy] : null, side = o => F ? P.side[F[o]] : 1, dside = o => F ? P.dealSide[F[o]] : 0;
  const funded = !strategy || coreShare(rounds, strategy) >= .5, cm = o => (F && F[o]===1 && !funded) ? P.unfunded : 1;
  let W = START.wireless, L = START.legacy, debt = START.debt, harvest = 0, divPaid = 0, divCut = false, divPenalty = 0;
  let fiberVal = 0, fiberChips = 0, entVal = 0, entChips = 0; const own = { ptv:0, media:0, cable:0, abroad:0 };
  const maturity = [1, 1, .8, .5];
  for (let t=0; t<4; t++){
    const a = rounds[t], k = kpis[t] || [], has = id => k.indexOf(id)>=0;
    let kBuild = 1; if (has('margin')) kBuild *= .85; if (has('fcf')) kBuild *= .85; if (has('rev')) kBuild *= .95;
    let take = f.take * P.fiberTake; if (has('homes')) take *= .93; if (has('churn')) take *= 1.05;
    const fEff = a.fiber * kBuild * (has('homes') ? 1.1 : 1);
    fiberChips += fEff; fiberVal += fEff * take * maturity[t] * side('fiber') * cm('fiber');
    const eEff = a.enterprise * kBuild; let et = f.ent * P.entTake; if (has('biz')) et *= 1.08;
    entChips += eEff; entVal += eEff * et * maturity[t] * side('enterprise') * cm('enterprise');
    let war = f.war; if (has('churn')) war *= .7; if (has('adds')) war *= .6;
    const w = a.wireless * kBuild * (t===2 ? 1.25 : 1);
    let g = w>=2 ? (P.wGrow*Math.min(w-2,3) + .015*Math.max(0,w-5)) * side('wireless') * cm('wireless') : -.06*(2-w);
    if (has('adds')) g -= .012;
    if (own.ptv>0 && F && F.ptv===1) g += P.tvSyn * (1.5 - 3.3*f.cord) * cm('ptv');
    if (own.media>0 && F && F.media===1) g += P.mediaSyn * cm('media');
    W *= (1 + g - war);
    L *= .78; harvest += a.legacy * .8 * (has('margin') ? 1.15 : 1);
    if (own.ptv>0){ let d = f.cord - dside('ptv'); if (has('video')) d *= .8; own.ptv *= (1-d) * (has('video') ? .975 : 1) * cm('ptv'); }
    if (own.media>0) own.media *= Math.max(.3, P.mediaMu + f.hits[t] + dside('media')) * cm('media');
    if (own.cable>0) own.cable *= Math.max(.5, P.cableMu + f.cab[t] + dside('cable') + (has('homes') ? .01 : 0)) * cm('cable');
    if (own.abroad>0) own.abroad *= Math.max(.3, P.abroadMu + f.fx[t] + dside('abroad') + (has('intl') ? .02 : 0)) * cm('abroad');
    DEALS.forEach(d => { if (a[d]>0 && own[d]===0) own[d] = DEAL_COST[d]; });
    if (a.cable>0 && f.blocked) own.cable = -1; // regulators block the deal
    divPaid += a.dividend;
    if (a.dividend < START.divExpected){ if (!divCut){ divPenalty += 3; divCut = true; } divPenalty += .3*(START.divExpected - a.dividend); }
    debt = Math.max(0, debt + a.borrow - a.debt);
  }
  let cableVal = own.cable; if (own.cable===-1) cableVal = DEAL_COST.cable - 1.5;
  if (fiberChips >= 12) fiberVal *= 1.15; if (entChips >= 8) entVal *= 1.1;
  let levN = 0; kpis.forEach(k => { if ((k||[]).indexOf('lev')>=0) levN++; }); const rs = f.rates * (1 - .2*levN/4);
  const debtPen = debt + Math.max(0, debt-10)*rs + Math.max(0, debt-14)*.8;
  const cashBack = own.cable===-1 ? 0 : 0;
  const parts = { wireless: W, fiber: fiberVal, enterprise: entVal, legacy: L + harvest, ptv: own.ptv, media: own.media, cable: cableVal, abroad: own.abroad, dividend: divPaid - divPenalty, debt: -debtPen };
  let v = cashBack; for (const p in parts) v += parts[p];
  return { v, parts, endDebt: debt };
}
const STATUS_QUO = [0,1,2,3].map(()=>Object.assign(emptyAlloc(), { wireless:2, legacy:3, dividend:3, debt:2 }));
function futures(seed, n){ const r = rng(seed); const out = []; for (let i=0;i<n;i++) out.push(drawFuture(r)); return out; }
function simulate(rounds, kpis, strategy, fut, base){
  const vals = fut.map(f => valueOf(rounds, kpis, strategy, f).v / base * 100);
  const s = vals.slice().sort((a,b)=>a-b); const q = p => s[Math.min(s.length-1, Math.floor(p*s.length))];
  return { vals, p10: q(.1), p50: q(.5), p90: q(.9), beat: vals.filter(x=>x>=100).length / vals.length };
}
function baseline(fut){ const s = fut.map(f=>valueOf(STATUS_QUO, [[],[],[],[]], null, f).v).sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; }
function project(rounds, kpis){
  const R = rounds.slice(), K = kpis.slice(); const last = R[R.length-1], lk = K[K.length-1];
  while (R.length<4){ const c = Object.assign({}, last); DEALS.forEach(d=>c[d]=0); R.push(c); K.push(lk); }
  return { R, K };
}
function coherence(rounds, kpis, strategy){
  const tot = emptyAlloc(); let all = 0, borrowed = 0;
  rounds.forEach(a => { OPTS.forEach(o => { tot[o] += a[o]; all += a[o]; }); borrowed += a.borrow; });
  let f = 0; OPTS.forEach(o => f += tot[o] * FIT[strategy][o]); f = all ? f/all : 0;
  const core = coreShare(rounds, strategy);
  const sorted = OPTS.map(o=>tot[o]).sort((a,b)=>b-a); const top2 = all ? (sorted[0]+sorted[1])/all : 0;
  let kf = 0, kn = 0; kpis.forEach(k => k.forEach(id => { kf += KFIT[strategy][id]; kn++; })); kf = kn ? kf/kn : 0;
  const led = ledger(rounds); const last = rounds[3];
  const endDebt = Math.max(0, led[3].debtStart + last.borrow - last.debt);
  const bal = Math.max(0, Math.min(1, 1 - (endDebt-10)/12));
  const said_no = OPTS.filter(o => tot[o]===0);
  const pts = { fit: 45*Math.min(1, f/.85), measures: 25*kf, focus: 15*Math.min(1, top2/.6), balance: 15*bal };
  const moved = (() => { const a = rounds[0], q = STATUS_QUO[0]; let d = 0; OPTS.forEach(o => d += Math.abs(a[o]-q[o])); return d / (spent(a) + spent(q)); })();
  return { score: Math.round(pts.fit+pts.measures+pts.focus+pts.balance), pts, tot, all, borrowed, endDebt, said_no, top2, core, funded: core>=.5, moved };
}
const Model = { CHIP_B, OPTS, DEALS, KPIS, DEAL_COST, START, FIT, KFIT, P, emptyAlloc, ledger, spent, futures, simulate, baseline, project, coherence, coreShare, valueOf, STATUS_QUO, rng };
if (typeof module !== 'undefined') module.exports = Model; else globalThis.Model = Model;

const C = {
  company: 'Meridian',
  opts: {
    fiber:      { name: 'Fiber to homes', note: 'Slow to pay back. Lasts for decades.' },
    wireless:   { name: 'Wireless network and spectrum', note: 'Two chips a cycle holds your position.' },
    enterprise: { name: 'Cloud and security for business', note: 'Services for large companies. Slow to pay back.' },
    legacy:     { name: 'Legacy copper network', note: 'Cash today from a shrinking business.' },
    ptv:        { name: 'Buy the satellite TV company', note: 'Pays back 1 chip in each of the next two cycles.' },
    cable:      { name: 'Buy the cable operator', note: 'Pays back 1 chip every cycle after. Regulators may block it.' },
    abroad:     { name: 'Buy the foreign wireless carrier', note: 'Pays back 1 chip every cycle after. Its value moves with the currency.' },
    media:      { name: 'Buy the film and TV studio', note: 'Pays back 1 chip every cycle after.' },
    dividend:   { name: 'Dividend', note: 'Shareholders expect three chips a cycle.' },
    debt:       { name: 'Pay down debt', note: 'Every six chips of debt costs one chip a cycle.' }
  },
  rows: ['fiber','wireless','enterprise','legacy','ptv','cable','abroad','media','dividend','debt'],
  kpis: {
    adds:   'Postpaid net adds',
    rev:    'Revenue growth',
    margin: 'Profit margin',
    fcf:    'Free cash flow',
    churn:  'Customer churn',
    homes:  'Homes passed',
    video:  'Video subscribers',
    biz:    'Business contract value',
    intl:   'International subscribers',
    lev:    'Debt to earnings'
  },
  strategies: {
    network:   { name: 'Best network', where: 'Connectivity only, in your own territory.', how: 'The fastest and most reliable wireless and fiber.' },
    bundle:    { name: 'The bundle', where: 'Connectivity plus TV.', how: 'One bill for phone, internet and TV, at scale.' },
    content:   { name: 'Content plus distribution', where: 'Connectivity plus owned film and TV.', how: 'Exclusive content delivered over your own network.' },
    broadband: { name: 'Broadband everywhere', where: 'Home internet across the country.', how: 'Buy cable lines outside your territory and build fiber inside it.' },
    abroad:    { name: 'Go abroad', where: 'Wireless in faster growing countries.', how: 'Export what you know about running wireless networks.' },
    business:  { name: 'Business first', where: 'Large companies and governments.', how: 'Sell cloud, security and connected devices on top of the network.' }
  },

const EF = (() => {

    if (cur && lab !== cur.label) cur = null;
    if (lab && !cur) { cur = items.find((i) => i.label === lab); if (!cur) { cur = { label: lab, ms: 0, rev: 0 }; items.push(cur); } seen = new Set(); }

  x.strokeStyle = '#9aa8be'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(px(100),18); x.lineTo(px(100),h); x.stroke(); x.setLineDash([]);
  strip.forEach((s,i)=>{ const y = 34+i*26; x.fillStyle = '#9aa8be'; x.fillText('Cycle '+(i+1), 0, y+4);
    x.fillStyle = 'rgba(224,180,90,.35)'; x.fillRect(px(s.p10), y-6, Math.max(2,px(s.p90)-px(s.p10)), 12);
    x.fillStyle = '#e0b45a'; x.fillRect(px(s.p50)-1.5, y-9, 3, 18); x.fillStyle = '#eef2f8'; x.fillText(Math.round(s.p50), Math.min(w-22, px(s.p90)+6), y+4); });
}
function commit(){
  const L = led(), a = Object.assign({}, S.cur), k = S.curK.slice(), i = t();
  const ms = memos(a, k, S.strat, L); S.memoLog.push(ms); S.rounds.push(a); S.kpis.push(k); (S.gave = S.gave || []).push({ o: S.curGave, chips: S.curGave==='none' ? null : a[S.curGave] });
  const P = M.project(S.rounds, S.kpis); const sim = M.simulate(P.R, P.K, S.strat, S.fut, S.base); S.strip.push(sim);
  ov.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><h2 id="mh" tabindex="-1">What your people did in ${C.news[i][0]}</h2>
  ${ms.map(m=>`<div class="memo ${m.tag}"><div class="t">${C.kpis[m.id]} ${m.tag==='fits'?'<i>Fits your strategy</i>':(m.tag==='conflicts'?'<i>Works against your strategy</i>':'')}</div>${m.text}</div>`).join('')}
  <canvas id="strip2" height="${34+S.strip.length*26}" style="margin-top:14px"></canvas>
  <div class="foot"><span class="mute small">The bar runs from the 10th to the 90th percentile of 1,000 futures.</span><button class="cta" data-next="1">${i<3?'Next cycle':'Run 1,000 futures'}</button></div></div></div>`;
  drawStrip($('#strip2'), S.strip); $('#mh').focus();
}
function next(){ ov.innerHTML = ''; if (t()<4){ startRound(); go('r'+t()); } else { S.sim = M.simulate(S.rounds, S.kpis, S.strat, S.fut, S.base); go('futures'); } }

function dice(f){
  const o = [['Customers leaving pay TV', f.cord<.14?'slowly':(f.cord<.25?'steadily':'fast')], ['Wireless price war', f.war<.017?'mild':(f.war<.034?'moderate':'severe')],
    ['Fiber sign ups', f.take<.87?'low':(f.take<1.15?'typical':'high')], ['Interest rates', f.rates<.12?'barely rose':(f.rates<.24?'rose':'rose sharply')]];
  const any = o => S.rounds.some(a=>a[o]>0), avg = x => x.reduce((p,c)=>p+c,0)/4;
  if (any('enterprise')) o.push(['Business demand', f.ent<.8?'low':(f.ent<1.15?'typical':'high')]);
  if (any('cable')) o.push(['Cable deal', f.blocked?'blocked by regulators':'approved']);
  if (any('abroad')) o.push(['Foreign currency', avg(f.fx)<-.07?'fell':(avg(f.fx)<.07?'held':'rose')]);
  if (S.rounds.some(a=>a.media>0)){ const m = avg(f.hits); o.push(['Studio releases', m<-.07?'missed':(m<.07?'were mixed':'were hits')]); }
  return o;
}
function futures(){
  const s = S.sim;
  app.innerHTML = `<h2>Your plan in 1,000 futures</h2><p class="mute">Each dot is one possible end of 2021. The futures differ in how fast customers leave pay TV, how hard rivals cut prices, how many homes and businesses sign up, how far rates rise, how currencies move, how the studio performs and whether regulators block the cable deal.</p>
  <div class="card"><canvas id="hist" height="330"></canvas>
  <div class="grid g4" style="margin-top:10px"><div class="tile"><div class="k">Weak future, 10th percentile</div><b>${Math.round(s.p10)}</b></div><div class="tile"><div class="k">Middle future</div><b>${Math.round(s.p50)}</b></div><div class="tile"><div class="k">Strong future, 90th percentile</div><b>${Math.round(s.p90)}</b></div><div class="tile"><div class="k">Beat the status quo plan</div><b>${pct(s.beat)}</b></div></div>
  <div id="drawbox" class="fb" style="display:none" role="status"></div>
  <div class="foot"><span class="mute small">100 is the middle result of the status quo plan: hold wireless, maintain copper, pay the dividend, pay down debt.</span><span><button class="cta" id="drawBtn" data-draw="1">Draw your future</button> <button class="cta" id="toDeb" data-go="debrief" style="display:none">Debrief</button></span></div></div>`;
  animHist(); if (S.drawn!=null) showDraw();
}

function animHist(){
  const c = $('#hist'), [x,w,h] = ctx2d(c), s = S.sim, binW = 4, nb = Math.ceil((AX[1]-AX[0])/binW), counts = new Array(nb).fill(0);
  const raw = s.vals.map(v=>{ const b = Math.max(0, Math.min(nb-1, Math.floor((v-AX[0])/binW))); return [b, counts[b]++]; });
  const mx = Math.max.apply(null, counts), bw = (w-20)/nb; let d = 14, cols = 1;
  for (; d>2; d-=.5){ cols = Math.max(1, Math.floor((bw-2)/d)); if (Math.ceil(mx/cols)*d <= h-56) break; }
  const rr = d*.4, pos = raw.map(r=>[r[0], Math.floor(r[1]/cols), r[1]%cols]);
  const cxOf = q => 10 + q[0]*bw + (bw-cols*d)/2 + (q[2]+.5)*d, cyOf = q => h-32-(q[1]+.5)*d;
  const px = v => 10 + (v-AX[0])/binW*bw; const start = performance.now(), dur = (FAST || histDone) ? 0 : 2200;
  function frame(now){ const p = dur ? Math.min(1,(now-start)/dur) : 1; x.clearRect(0,0,w,h);
    x.strokeStyle = '#2a3750'; x.beginPath(); x.moveTo(0,h-28); x.lineTo(w,h-28); x.stroke();
    x.font = '12px Inter'; x.fillStyle = '#9aa8be'; for (let v=60; v<=180; v+=20){ x.fillText(v, px(v)-8, h-10); }
    x.setLineDash([4,4]); x.strokeStyle = '#9aa8be'; x.beginPath(); x.moveTo(px(100),10); x.lineTo(px(100),h-28); x.stroke(); x.setLineDash([]); x.fillText('Status quo', px(100)+6, 20);
    const n = Math.floor(p*pos.length);
    for (let i=0;i<n;i++){ const cx = cxOf(pos[i]), cy = cyOf(pos[i]); x.beginPath(); x.arc(cx,cy,rr,0,7); x.fillStyle = pos[i][0]*binW+AX[0] >= 100 ? 'rgba(224,180,90,.85)' : 'rgba(154,168,190,.7)'; x.fill(); }
    if (S.drawn!=null && p===1){ const cx = cxOf(pos[S.drawn]), cy = cyOf(pos[S.drawn]); x.beginPath(); x.arc(cx,cy,rr+5,0,7); x.strokeStyle = '#5cc8e8'; x.lineWidth = 3; x.stroke(); x.beginPath(); x.arc(cx,cy,rr+1,0,7); x.fillStyle = '#5cc8e8'; x.fill(); x.lineWidth = 1; }
    if (p<1) requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
function draw(){ const r = M.rng(S.seed+99); S.drawn = Math.floor(r()*1000); showDraw(); histDone = true; animHist(); }
function showDraw(){
  const v = S.sim.vals[S.drawn], f = S.fut[S.drawn], b = $('#drawbox'); if (!b) return;
  const rank = Math.round(S.sim.vals.filter(z=>z<=v).length/10);
  b.style.display = 'block'; b.innerHTML = `<b>Your future: ${Math.round(v)}.</b> That is the ${ord(rank)} percentile of your own 1,000. ${dice(f).map(d=>`${d[0]}: ${d[1]}.`).join(' ')}`;
  $('#drawBtn').style.display = 'none'; $('#toDeb').style.display = '';
}
function ord(n){ n = Math.max(1, Math.min(99, n)); const s = ['th','st','nd','rd'], v = n%100; return n + (s[(v-20)%10] || s[v] || s[0]); }

function moves(co){
  const out = [], cyc = a => a.length===1 ? 'cycle '+a[0] : 'cycles '+a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  const bad = []; S.rounds.forEach((a,i)=>{ if ((a.fiber+a.wireless+a.enterprise)>2 && (S.kpis[i].indexOf('margin')>=0 || S.kpis[i].indexOf('fcf')>=0)) bad.push(i+1); });
  if (bad.length) out.push(`In ${cyc(bad)} you funded the network and paid your people on margin or cash flow. They slowed the build to hit the measure.`);
  if (co.borrowed>0){ const drag = M.ledger(S.rounds).reduce((p,l)=>p+l.drag,0); out.push(`You borrowed ${plural(co.borrowed,'chip')} over four cycles. Interest took ${plural(drag,'chip')} of your capital. You ended with ${bil(co.endDebt)} of debt.`); }
  const cut = []; S.rounds.forEach((a,i)=>{ if (a.dividend<M.START.divExpected) cut.push(i+1); });
  if (cut.length) out.push(`You paid less than the expected dividend in ${cyc(cut)}. Shareholders marked the company down, and the chips went elsewhere.`);
  M.DEALS.forEach(o=>{ S.rounds.forEach((a,i)=>{ if (a[o]>0 && M.FIT[S.strat][o]===0) out.push(`In cycle ${i+1} you chose to ${lc(C.opts[o].name)}. Your stated strategy was ${C.strategies[S.strat].name}.`); }); });
  const dead = []; S.memoLog.forEach((ms,i)=>ms.forEach(m=>{ if (/Nobody could act/.test(m.text)) dead.push(i+1); }));
  if (dead.length) out.push(`In ${cyc([...new Set(dead)])} one of your three measures tracked a business you had not funded.`);
  if (!out.length) out.push('Your capital and your measures pointed the same way in every cycle.');
  return out.slice(0,4);
}
function debrief(){
  const co = M.coherence(S.rounds, S.kpis, S.strat); S.co = co;
  if (!S.self){ app.innerHTML = `<section class="card" style="max-width:760px;margin:8vh auto"><h2>Before the debrief</h2><fieldset><legend>How well did your capital match your strategy?</legend>${radios('self', [['hi','Closely'],['mid','Partly'],['lo','Loosely']], null)}</fieldset></section>`; return; }
  const v = S.sim.vals[S.drawn], good = v>=100, coh = co.score>=70;
  const quad = (coh?'Aligned plan. ':'Unaligned plan. ') + (good?'Good draw.':'Bad draw.');
  const funded = M.OPTS.filter(o=>co.tot[o]>0), g = C.guess.a.find(a=>a[0]===S.guess), st = C.strategies[S.strat];
  const coreNames = M.OPTS.filter(o=>M.FIT[S.strat][o]===1).map(o=>lc(C.opts[o].name));
  const bar = (n, v, max) => `<div class="b"><span>${n}</span><div class="tr"><i style="width:${Math.round(v/max*100)}%"></i></div><span>${Math.round(v)} of ${max}</span></div>`;
  const n1 = Object.keys(C.sources).indexOf('mck')+1;
  app.innerHTML = `<h2>Debrief</h2>
  <div class="grid g2"><div class="card"><div class="tile"><div class="k">Share of your capital that went to your strategy</div></div><div class="big">${Math.round(co.core*100)}%</div>
    <p>You chose ${st.name}. Its core is ${coreNames.join(' and ')}. ${co.funded ? 'You funded it.' : 'It got less than half your capital. In this model a strategy that is announced and not funded earns less on every core chip.'}</p>
    <p class="mute">You rated the match as ${({hi:'close',mid:'partial',lo:'loose'})[S.self]}. Alignment score: <b style="color:var(--ink)">${co.score} of 100</b>. It measures fit between your strategy, your capital and your measures. It does not say which strategy is right.</p>
    <div class="bars">${bar('Capital fits strategy', co.pts.fit, 45)}${bar('Measures fit', co.pts.measures, 25)}${bar('Focus', co.pts.focus, 15)}${bar('Balance sheet', co.pts.balance, 15)}</div></div>
   <div class="card"><h3>${quad}</h3>
    <p>Your plan beat the status quo plan in ${pct(S.sim.beat)} of 1,000 futures. The future you drew came in at ${Math.round(v)}.</p>
    <h3 style="margin-top:14px">What you said no to</h3><div>${co.said_no.length ? co.said_no.map(o=>`<span class="pill no">${C.opts[o].name}</span>`).join('') : '<span class="pill">Nothing. You funded all ten.</span>'}</div>
    <h3 style="margin-top:14px">What you funded</h3><div>${funded.map(o=>`<span class="pill">${C.opts[o].name}: ${co.tot[o]}</span>`).join('')}</div>
    <p class="mute" style="margin-top:10px">At the start you said ${g[1].toLowerCase()} of a budget should move to fund a new strategy. Your first budget moved ${Math.round(co.moved*100)}% away from the status quo plan. ${C.mck}<sup><a href="${C.sources.mck[1]}" target="_blank" rel="noopener">[${n1}]</a></sup></p></div></div>
  <div class="card" style="margin-top:16px"><h3>What you said you were giving up</h3>${(S.gave||[]).length ? S.gave.map((g,i)=>`<div class="memo">${C.news[i][0]}. You said: <b>${g.o==='none' ? 'nothing' : lc(C.opts[g.o].name)}</b>. ${g.o==='none' ? `You funded ${M.OPTS.filter(o=>S.rounds[i][o]>0).length} of ${M.OPTS.length} lines that cycle.` : (g.chips>0 ? `You still put ${plural(g.chips,'chip')} there.` : 'You put no chips there.')}</div>`).join('') : '<p class="mute">Not recorded.</p>'}${EF.html()}</div>
  <div class="card" style="margin-top:16px"><h3>Your moves</h3>${moves(co).map(m=>`<div class="memo">${m}</div>`).join('')}
    <p style="margin-top:14px"><b>${C.transfer}</b></p>
    <div class="foot"><button class="ghost" data-about="1">How the score and the model work</button><button class="cta" data-go="reveal">See the real case</button></div></div>`;
}
function reveal(){
  const sup = ks => ks.map(k=>{ const n = Object.keys(C.sources).indexOf(k)+1; return `<sup><a href="${C.sources[k][1]}" target="_blank" rel="noopener">[${n}]</a></sup>`; }).join('');
  const own = o => { const i = S.rounds.findIndex(a=>a[o]>0); return i>=0 ? 'Bought in cycle '+(i+1) : 'Passed'; };
  const co = S.co || M.coherence(S.rounds, S.kpis, S.strat); const cut = S.rounds.some(a=>a.dividend<M.START.divExpected);
  app.innerHTML = `<h2>A real company sat at this table in 2014</h2>
  <p class="mute">This is the public record of AT&amp;T. The simulation is a generic model. It does not show what AT&amp;T would have earned on another path.</p>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>The record</h3><div class="tl">${C.timeline.map(e=>`<div class="y">${e[0]}</div><div>${esc(e[1])}${sup(e[2])}</div>`).join('')}</div></div>
  <div class="card"><h3>Side by side</h3><table><tr><th></th><th>You</th><th>AT&amp;T</th></tr>
   <tr><td>Satellite TV</td><td>${own('ptv')}</td><td>Bought DIRECTV in 2015</td></tr>
   <tr><td>Film and TV studio</td><td>${own('media')}</td><td>Bought Time Warner in 2018</td></tr>
   <tr><td>Cable operator</td><td>${own('cable')}</td><td>Did not buy one</td></tr>
   <tr><td>Foreign carrier</td><td>${own('abroad')}</td><td>Had acquired two wireless carriers in Mexico by July 2015</td></tr>
   <tr><td>Debt</td><td>${bil(M.START.debt)} to ${bil(co.endDebt)}</td><td>$82.1 billion total debt in 2014. $180.4 billion net debt in June 2018.</td></tr>
   <tr><td>Dividend</td><td>${cut?'Paid less than expected at least once':'Paid in full every cycle'}</td><td>$1.85 a share in 2014. $2.08 before the 2022 change. $1.11 after.</td></tr>
   <tr><td>Later</td><td>${co.said_no.length ? 'Said no to ' + plural(co.said_no.length,'option') : 'Funded all ten options'}</td><td>Exited satellite TV and the studio between 2021 and 2024 and named 5G and fiber as its focus.</td></tr></table>
   <p class="mute small" style="margin-top:10px">Sources are numbered and listed under About. Total debt and net debt are different measures.</p>
   <div class="foot"><button class="ghost" data-about="1">About and sources</button><button class="cta" data-again="1">Play again</button></div></div></div>`;
}
function about(){
  const src = Object.keys(C.sources).map((k,i)=>{ const s = C.sources[k]; return `<li>${esc(s[0])}${s[1]?`. <a href="${s[1]}" target="_blank" rel="noopener">Link</a>`:''}</li>`; }).join('');
  ov.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ah"><h2 id="ah" tabindex="-1">About this simulation</h2>
  <h3>What is real</h3><p>The final screen reports AT&amp;T's public record from company filings and press releases. Every figure there has a numbered source below.</p>
  <h3>What is modeled</h3><p>${C.company} is fictional. Its dashboard, the chip values, the deal terms and the 1,000 futures are an illustrative model written for this demo. The model is not a forecast and not a model of AT&amp;T. Your budget each cycle does not vary by future.</p>
  <h3>The model rewards alignment, by design</h3><p>Each of the six strategies has a similar middle result when it is fully funded and its measures match. That is a design choice. It treats the questions of 2014 as open, and the model does not use what happened afterward. An option earns its full return when it is core to your strategy, 85% when it supports the strategy and 65% as a side bet. A strategy that gets less than half your capital earns 12% less on its core options. Other assumptions: fiber and business services return about twice their cost when they have time to mature. Wireless needs two chips a cycle to hold its value. Legacy spending returns less than it costs. Pay TV loses up to 30% of its value each cycle. Regulators block the cable deal in 15% of futures. Debt above ten chips gets more expensive when rates rise. Cutting the dividend costs value once and frees capital after that.</p>
  <h3>How your people respond</h3><p>The staff responses are illustrative. They follow the pattern Steven Kerr described in 1975: people do what is rewarded.</p>
  <h3>How the score works</h3><p>Capital fits strategy, 45 points. Measures fit strategy, 25 points. Focus, 15 points, full marks when your two largest uses take 60% of capital. Balance sheet, 15 points. The fit tables are the author's judgment, built on the strategy cascade in Playing to Win and on Porter's argument that strategy requires trade-offs. Strategy has no computable right answer, and reasonable people would weight these differently.</p>
  <h3>Sources</h3><ol>${src}</ol>
  <p class="mute small">Built by José Antonio Bowen with Claude Fable 5.2 as a ten minute demo for <a href="https://weteachwithai.com/vibe-coding/" target="_blank" rel="noopener">weteachwithai.com</a>. No tracking. Nothing you enter leaves this page.</p>
  <div class="foot"><span></span><button class="cta" data-close="1">Close</button></div></div></div>`;
  $('#ah').focus();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.go){ if (d.go==='r0') startRound(); go(d.go); }
  else if (d.strat){ S.strat = d.strat; render(); }
  else if (d.inc){ const o = d.inc; if (o==='borrow'){ if (S.cur.borrow<M.START.borrowMax) S.cur.borrow++; } else if (left()>0) S.cur[o]++; render(); }
  else if (d.dec){ if (S.cur[d.dec]>0) S.cur[d.dec]--; render(); }
  else if (d.deal){ S.cur[d.deal] = S.cur[d.deal] ? 0 : M.DEAL_COST[d.deal]; render(); }
  else if (d.kpi){ const i = S.curK.indexOf(d.kpi); if (i>=0) S.curK.splice(i,1); else if (S.curK.length<3) S.curK.push(d.kpi); render(); }
  else if (d.commit){ if (left()===0 && S.curK.length===3 && S.curGave) commit(); }
  else if (d.next) next();
  else if (d.draw) draw();
  else if (d.about || b.id==='aboutBtn') about();
  else if (d.close) ov.innerHTML = '';
  else if (d.again){ reset(); go('intro'); }
});
document.addEventListener('change', e => { const i = e.target; if (i.name==='guess'){ S.guess = i.value; render(); } if (i.name==='diag'){ S.diag = i.value; render(); } if (i.name==='self'){ S.self = i.value; render(); } if (i.name==='gave'){ S.curGave = i.value; render(); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && ov.querySelector('[data-close]')) ov.innerHTML = ''; });
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if (/^r\d/.test(S.step)){ drawMap(); if ($('#strip')) drawStrip($('#strip'), S.strip); } if (S.step==='futures') animHist(); }, 150); });
EF.watch(() => { if (ov.innerHTML) return null; const s = S.step; return s==='guess' ? 'Opening guess' : s==='diag' ? 'Diagnosis' : s==='choose' ? 'Choosing a strategy' : /^r\d/.test(s) ? 'Capital cycle ' + (+s[1]+1) : (s==='debrief' && !S.self) ? 'Rating your own plan' : null; });
reset(); render();
window.__demo = { state: () => S, go, model: M,
  play(plan){ S.guess = plan.guess||'all'; S.diag = plan.diag||'core'; S.strat = plan.strat; S.gave = []; S.rounds = []; S.kpis = []; S.strip = []; S.memoLog = [];
    plan.rounds.forEach((a,i)=>{ S.cur = Object.assign(M.emptyAlloc(), a); S.curK = plan.kpis[i] || plan.kpis[0]; S.curGave = (plan.gave && plan.gave[i]) || 'none'; if (left()!==0) throw new Error('round '+i+' left '+left()); commit(); ov.innerHTML = ''; });
    S.sim = M.simulate(S.rounds, S.kpis, S.strat, S.fut, S.base); go('futures'); } };
})();
</script></body></html>
